name: Build htop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libncursesw5-dev autoconf automake libtool

      - name: Configure & Build
        run: |
          ./autogen.sh
          ./configure
          make -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: htop-linux
          path: htop
